name: Export Godot Project

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Choose export target'
        required: true
        default: 'Windows'
        type: choice
        options:
          - 'Windows'
          - 'Linux'
          - 'Both'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot 4.3 (Standard)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Rebuild UID cache & import assets
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --editor --quit || true

      # bot 原生二进制（rust/cold_clear_engine/native 下的 dll/exe）已随仓库提交，
      # 不能打包进 Godot pck，导出时复制到 exe 旁作为松散文件夹由游戏外部读取。

      - name: Export Windows Desktop
        if: ${{ inputs.target_platform == 'Windows' || inputs.target_platform == 'Both' || github.event_name == 'push' }}
        run: |
          mkdir -p build/win
          godot --headless --export-release "Windows Desktop" build/win/TowerTris.exe
          # 把仓库里已提交的 bot 二进制作为松散 native/ 文件夹放到 exe 旁
          # （不打包进 pck，由 pck 在运行时从外部读取；内部文件名保持不变）
          cp -r rust/cold_clear_engine/native build/win/native
          cd build/win && zip -r ../../TowerTris-Windows.zip . && cd ../..

      - name: Export Linux
        if: ${{ inputs.target_platform == 'Linux' || inputs.target_platform == 'Both' }}
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/TowerTris.x86_64
          cd build/linux && zip -r ../../TowerTris-Linux.zip . && cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Release Build #${{ github.run_number }}"
          files: |
            TowerTris-*.zip
